[package]
name = "omnimotion"
description = "Motion planning, board I/O and TMC2209 driver control for the Omnimotion board"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc = { version = "3.4.0", default-features = false }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
libm = "0.2.16"
serde = { version = "1.0", default-features = false, features = ["derive"] }
tmc2209 = { version = "0.3.0", default-features = false }

[dev-dependencies]
embedded-io = "0.7.1"
pollster = "1.0.3"
postcard = { version = "1.2", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
