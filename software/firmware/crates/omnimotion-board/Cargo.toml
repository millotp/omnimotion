[package]
name = "omnimotion-board"
description = "ESP32-S3 board support for the Omnimotion motion controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omnimotion = { path = "../../../crates/omnimotion" }
esp-hal = { version = "1.1.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3", default-features = false, features = ["esp32s3", "embassy", "esp-radio"] }
esp-radio = { version = "0.18", default-features = false, features = ["esp32s3", "wifi", "unstable"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp"] }
embedded-storage = "0.3.2"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
heapless = "0.9.4"
static_cell = "2.1.1"
embedded-io-async = "0.7.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.8.0"
embassy-executor = { version = "0.10.0", default-features = false }
esp-nvs = { version = "0.6.3", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
esp-alloc = { version = "0.10.0", features = ["esp32s3"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.2", default-features = false, features = ["alloc"] }

[features]
# Replaces what a bare board lacks with a virtual machine, so firmware can run with nothing attached:
# the TMC2209s answer from an emulator, VMOTOR reads 24 V, the e-stop is closed and the endstops come
# from a model of the machine that the application installs (`virtual_hardware::install`). Never for a
# board that drives real motors.
virtual-hardware = []

[dev-dependencies]
esp-backtrace = { version = "0.19", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial"] }
